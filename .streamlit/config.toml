# Tagmate app theme -- a near-black sidebar (matching the logo's black
# background) over a light, clean workspace, with a Veeqo-style layout:
# logo mark at the top of the sidebar, icon-led nav below it, and the
# active page highlighted as a rounded pill in the brand blue.

[theme]
base = "light"
primaryColor = "#3B6FE0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F6FA"
textColor = "#1B2340"
font = "sans serif"

[theme.sidebar]
backgroundColor = "#0E0E10"
secondaryBackgroundColor = "#18181B"
textColor = "#E9EAEE"
